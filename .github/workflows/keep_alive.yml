name: Render Service Keep-Alive

on:
  schedule:
    # Chạy mỗi 10 phút để server Render không bị ngủ đông (cold start)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions trên GitHub

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Sending keep-alive ping to Render service..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://vn-quant-mf5g.onrender.com/system-status)
          echo "Render HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 301 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "Server is active and awake!"
          else
            echo "Server pinged with status $RESPONSE"
          fi
