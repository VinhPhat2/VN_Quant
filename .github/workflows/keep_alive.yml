name: Render Service Keep-Alive

on:
  push:
    branches: [main]
  schedule:
    # Chạy định kỳ mỗi 10 phút để server Render không bị ngủ đông (cold start)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ tab Actions trên GitHub

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Sending keep-alive ping to Render service..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://vn-quant-mf5g.onrender.com/api/system-status)
          echo "Render /api/system-status HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Fallback pinging root / ..."
            RESPONSE_ROOT=$(curl -s -o /dev/null -w "%{http_code}" https://vn-quant-mf5g.onrender.com/)
            echo "Render / HTTP Status: $RESPONSE_ROOT"
          fi
          echo "Keep-alive ping completed successfully!"
