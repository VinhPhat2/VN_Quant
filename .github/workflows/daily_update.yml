name: Daily Stock Data Updater

on:
  schedule:
    # 11:00 UTC = 18:00 Giờ VN (Thứ 2 đến Thứ 6, sau khi kết thúc phiên giao dịch)
    - cron: '0 11 * * 1-5'
    # 16:00 UTC = 23:00 Giờ VN (Thứ 2 đến Thứ 6, sau khi Kafi/FiinTrade đối soát xong số liệu Cá nhân & Tổ chức)
    - cron: '0 16 * * 1-5'
    # 01:30 UTC = 08:30 Sáng Giờ VN (Thứ 2 đến Thứ 6, quét chốt sổ lần cuối trước giờ mở phiên 09:00)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thử bằng tay bất kỳ lúc nào trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests pandas

      - name: Run Kafi Downloader (Update 387 stocks EOD + Dividend Adjustment Check)
        run: |
          python kafi_downloader.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add csv_data/ fiintrade_master_map.json
          if git diff --staged --quiet; then
            echo 'No new data today or flow data pending'
          else
            git commit -m 'Auto-update daily stock data & dividend adjusted prices'
            git push
          fi

      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "No RENDER_DEPLOY_HOOK secret configured, relying on GitHub push webhook."
          fi
