name: Daily Stock Data Updater

on:
  schedule:
    # Tránh phút tròn :00 (GitHub thường bị trễ/drop giờ cao điểm). Rải nhiều mốc sau 15:00 VN:
    # 08:45 UTC = 15:45 Giờ VN (Chốt sớm ngay sau khi thị trường đóng cửa 15:00)
    - cron: '45 8 * * 1-5'
    # 09:25 UTC = 16:25 Giờ VN (Quét dự phòng lần 1)
    - cron: '25 9 * * 1-5'
    # 10:10 UTC = 17:10 Giờ VN (Quét dự phòng lần 2)
    - cron: '10 10 * * 1-5'
    # 11:15 UTC = 18:15 Giờ VN (Mốc chính sau 18h - Kafi hoàn tất chốt EOD toàn thị trường)
    - cron: '15 11 * * 1-5'
    # 11:45 UTC = 18:45 Giờ VN (Mốc dự phòng sau 18h đề phòng GitHub delay)
    - cron: '45 11 * * 1-5'
    # 12:20 UTC = 19:20 Giờ VN (Mốc tối kiểm tra bổ sung)
    - cron: '20 12 * * 1-5'
    # 15:35 UTC = 22:35 Giờ VN (Mốc đêm rà soát toàn bộ khớp lệnh)
    - cron: '35 15 * * 1-5'
    # 01:15 UTC = 08:15 Sáng Giờ VN (Quét lần cuối trước giờ mở phiên 09:00 hôm sau)
    - cron: '15 1 * * 1-5'
  workflow_dispatch: # Cho phép bấm nút chạy thử bằng tay bất kỳ lúc nào trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run Kafi Downloader (Update 387 stocks EOD + Dividend Adjustment Check)
        run: |
          python kafi_downloader.py

      - name: Recompute Market Deciles & Flow Alpha Cache
        run: |
          python update_deciles_cache.py

      - name: Recompute Stochastic Screener & Signals Cache
        run: |
          python stoch_screener.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add csv_data/ fiintrade_master_map.json latest_deciles_cache.csv stoch_signals_cache.json
          if git diff --staged --quiet; then
            echo 'No new data today or flow data pending'
          else
            git commit -m 'Auto-update daily stock data, dividend adjustments & stoch signals'
            git push
          fi

      - name: Trigger Render Deploy Hook (if secret configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deploy..."
            curl -s -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "No RENDER_DEPLOY_HOOK secret configured, relying on GitHub push webhook."
          fi
