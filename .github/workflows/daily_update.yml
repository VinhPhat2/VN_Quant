name: Daily Stock Data Updater

on:
  schedule:
    # 11:00 UTC = 18:00 Gi? VN (Th? 2 d?n Th? 6, sau khi k?t thúc phiên giao d?ch)
    - cron: '0 11 * * 1-5'
    # 16:00 UTC = 23:00 Gi? VN (Th? 2 d?n Th? 6, sau khi Kafi/FiinTrade d?i soát xong s? li?u Cá nhân & T? ch?c)
    - cron: '0 16 * * 1-5'
    # 01:30 UTC = 08:30 Sáng Gi? VN (Th? 2 d?n Th? 6, quét ch?t s? l?n cu?i tru?c gi? m? phiên 09:00)
    - cron: '30 1 * * 1-5'
  workflow_dispatch: # Cho phép b?m nút ch?y th? b?ng tay b?t k? lúc nào trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir requests pandas

      - name: Run Kafi Downloader (Update 387 stocks EOD + Dividend Adjustment Check)
        run: |
          python kafi_downloader.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add csv_data/ fiintrade_master_map.json
          if git diff --staged --quiet; then
            echo 'No new data today or flow data pending'
          else
            git commit -m 'Auto-update daily stock data & dividend adjusted prices [skip ci]'
            git push
          fi
